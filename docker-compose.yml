services:
  kafka:
    image: apache/kafka:latest
    container_name: userpost-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  user_service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    env_file:
      - ./user_service/app/.env.docker
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  post_service:
    build:
      context: .
      dockerfile: post_service/Dockerfile
    env_file:
      - ./post_service/app/.env.docker
    ports:
      - "8001:8001"
    depends_on:
      - user_service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      USER_API_URL: http://user_service:8000
      POST_API_URL: http://post_service:8001
    ports:
      - "3000:3000"
    depends_on:
      - user_service
      - post_service
